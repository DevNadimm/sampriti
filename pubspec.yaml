name: sampriti
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^8.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  hugeicons: ^1.1.5
  awesome_snackbar_content: ^0.1.8
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.3
  device_preview: ^1.3.1
  connectivity_plus: ^7.0.0
  modal_bottom_sheet: ^3.0.0
  dio: ^5.9.1
  location: ^8.0.1
  permission_handler: ^12.0.1
  geocoding: ^4.0.0
  network_info_plus: ^7.0.0
  logger: ^2.6.2
  get_it: ^9.2.1
  googleapis_auth: ^2.3.1
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.9.0
  cloud_firestore: ^6.10.2
  firebase_auth: ^6.7.1
  firebase_storage: ^13.6.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.8
  image_picker: ^1.2.2
  url_launcher: ^6.3.2
  pdf: ^3.11.3
  printing: ^5.14.3
  bangla_pdf: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  image: 4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/icons/
    - assets/images/flags/
    - assets/images/illustrations/
    - assets/icons/
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/logos/app_logo.png"
  adaptive_icon_background: "#FFFFFF"